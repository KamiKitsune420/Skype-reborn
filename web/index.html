<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skype™ Reborn - Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #app { height: 100%; display: flex; flex-direction: column; }
        .sidebar { width: 350px; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; background: #f0f4f8; }
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: white; }
        .contact-list { overflow-y: auto; flex-grow: 1; }
        .message-history { overflow-y: auto; flex-grow: 1; padding: 20px; background: #fff; display: flex; flex-direction: column; }
        .contact-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #e1e8ed; display: flex; align-items: center; transition: background 0.2s; }
        .contact-item:hover { background-color: #e1eef7; }
        .contact-item.active { background-color: #cce4f7; border-left: 4px solid #0078d4; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; }
        .status-ONLINE { background-color: #28a745; }
        .status-OFFLINE { background-color: #adb5bd; border: 1px solid #6c757d; }
        .message { margin-bottom: 8px; max-width: 70%; padding: 8px 15px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; position: relative; }
        .message.sent { background-color: #eff7ff; color: #004578; align-self: flex-end; border: 1px solid #cce4f7; }
        .message.received { background-color: #f3f3f3; color: #201f1e; align-self: flex-start; border: 1px solid #e1e1e1; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #00aff0 0%, #0078d4 100%); z-index: 1000; display: flex; justify-content: center; align-items: center; overflow-y: auto; }
        .hidden { display: none !important; }
        .italic { font-style: italic; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="card shadow-lg p-4 my-5" style="width: 450px; border-radius: 15px;">
        <div class="text-center mb-4">
            <i class="bi bi-skype text-primary" style="font-size: 3rem;"></i>
            <h2 class="mt-2 fw-bold text-dark">Skype™</h2>
            <p id="authTitle" class="text-muted">Sign in to your account</p>
        </div>
        
        <div id="loginForm">
            <div class="mb-3"><input type="text" id="username" class="form-control form-control-lg" placeholder="Skype Name"></div>
            <div class="mb-3"><input type="password" id="password" class="form-control form-control-lg" placeholder="Password"></div>
            <button id="loginBtn" class="btn btn-primary btn-lg w-100 mb-2 py-2">Sign in</button>
            <button onclick="toggleRegister(true)" class="btn btn-link w-100 text-decoration-none">Create account</button>
        </div>

        <div id="registerForm" class="hidden">
            <div class="mb-3"><input type="text" id="reg_user" class="form-control" placeholder="Skype Name"></div>
            <div class="mb-3"><input type="password" id="reg_pass" class="form-control" placeholder="Password"></div>
            <div class="mb-3"><input type="email" id="reg_email" class="form-control" placeholder="Email Address"></div>
            <div class="row">
                <div class="col mb-3"><input type="text" id="reg_fname" class="form-control" placeholder="First Name"></div>
                <div class="col mb-3"><input type="text" id="reg_lname" class="form-control" placeholder="Last Name"></div>
            </div>
            <button id="doRegisterBtn" class="btn btn-success w-100 mb-2">Register</button>
            <button onclick="toggleRegister(false)" class="btn btn-link w-100 text-decoration-none">Back to sign in</button>
        </div>

        <div id="loginStatus" class="mt-3 text-center small fw-semibold"></div>
    </div>
</div>

<div id="app" class="hidden">
    <div class="d-flex flex-grow-1 overflow-hidden">
        <div class="sidebar">
            <div class="p-3 bg-white border-bottom">
                <div class="d-flex align-items-center mb-3">
                    <div class="rounded-circle bg-secondary me-3 d-flex align-items-center justify-content-center text-white" style="width: 40px; height: 40px;"><i class="bi bi-person-fill"></i></div>
                    <div class="flex-grow-1">
                        <div id="myUsername" class="fw-bold text-dark"></div>
                        <div class="small text-success">Online</div>
                    </div>
                    <button id="logoutBtn" class="btn btn-sm text-muted"><i class="bi bi-box-arrow-right"></i></button>
                </div>
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control bg-light" placeholder="Search contacts...">
                </div>
            </div>
            <div id="contactList" class="contact-list"></div>
        </div>

        <div id="chatArea" class="chat-area hidden">
            <div class="p-3 border-bottom d-flex align-items-center bg-light">
                <h5 id="activeChatName" class="mb-0 fw-bold text-dark"></h5>
                <div id="typingIndicator" class="ms-3 small text-primary italic"></div>
                <div class="ms-auto">
                    <button id="webCallBtn" class="btn btn-success rounded-pill me-2"><i class="bi bi-telephone-fill"></i> Call</button>
                </div>
            </div>
            <div id="messageHistory" class="message-history"></div>
            <div class="p-3 border-top">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
                    <button id="sendBtn" class="btn btn-primary">SEND</button>
                </div>
            </div>
        </div>

        <div id="welcomeArea" class="chat-area d-flex justify-content-center align-items-center text-center">
            <h3>Select a contact to start.</h3>
        </div>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
    const API_URL = "http://127.0.0.1:8000";
    const WS_URL = "ws://127.0.0.1:8000";
    let token = null, userId = null, ws = null, selectedContactId = null, contacts = [];
    let peerConnection = null, localStream = null;

    function toggleRegister(show) {
        document.getElementById('loginForm').classList.toggle('hidden', show);
        document.getElementById('registerForm').classList.toggle('hidden', !show);
    }

    async function login() {
        const user = document.getElementById('username').value, pass = document.getElementById('password').value;
        const resp = await fetch(`${API_URL}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass }) });
        if (resp.ok) {
            const data = await resp.json(); token = data.token; userId = data.user_id;
            document.getElementById('myUsername').innerText = user;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initWS(); loadContacts();
        }
    }

    async function register() {
        const payload = {
            username: document.getElementById('reg_user').value, password: document.getElementById('reg_pass').value,
            email: document.getElementById('reg_email').value, first_name: document.getElementById('reg_fname').value, last_name: document.getElementById('reg_lname').value
        };
        const resp = await fetch(`${API_URL}/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (resp.ok) toggleRegister(false);
    }

    async function initWS() {
        const ticketResp = await fetch(`${API_URL}/ws/ticket`, { 
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` } 
        });
        if (!ticketResp.ok) return;
        const { ticket } = await ticketResp.json();
        ws = new WebSocket(`${WS_URL}/ws/${ticket}`);
        ws.onmessage = async (event) => {
            const envelope = JSON.parse(event.data);
            if (envelope.type === "CHAT_RECEIVE") {
                if (envelope.payload.sender_id === selectedContactId || envelope.payload.conversation_id === selectedContactId) {
                    appendMessage(envelope.payload.sender_id === userId ? "sent" : "received", envelope.payload.content);
                }
            } else if (envelope.type === "CALL_INITIATE") {
                handleIncomingCall(envelope.payload);
            } else if (envelope.type === "CALL_ACCEPT") {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(envelope.payload.data.sdp));
            } else if (envelope.type === "CALL_CANDIDATE") {
                await peerConnection.addIceCandidate(new RTCIceCandidate(envelope.payload.data.candidate));
            } else if (envelope.type === "CALL_HANGUP") {
                endCall();
            }
        };
    }

    async function startWebCall() {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({ type: "CALL_CANDIDATE", payload: { target_id: selectedContactId, sender_id: userId, data: { candidate: event.candidate } } }));
            }
        };
        
        peerConnection.ontrack = (event) => {
            document.getElementById('remoteAudio').srcObject = event.streams[0];
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        ws.send(JSON.stringify({
            type: "CALL_INITIATE",
            payload: { session_id: crypto.randomUUID(), target_id: selectedContactId, sender_id: userId, data: { sdp: offer } }
        }));
    }

    async function handleIncomingCall(payload) {
        if (confirm("Incoming Web Call. Accept?")) {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({ type: "CALL_CANDIDATE", payload: { target_id: payload.sender_id, sender_id: userId, data: { candidate: event.candidate } } }));
                }
            };
            
            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.data.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: "CALL_ACCEPT",
                payload: { session_id: payload.session_id, target_id: payload.sender_id, sender_id: userId, data: { sdp: answer } }
            }));
        }
    }

    function endCall() {
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    }

    async function loadContacts() {
        const resp = await fetch(`${API_URL}/contacts`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (resp.ok) { contacts = await resp.json(); renderContactList(contacts); }
    }

    function renderContactList(list) {
        const container = document.getElementById('contactList'); container.innerHTML = '';
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = `contact-item ${c.id === selectedContactId ? 'active' : ''}`;
            div.innerHTML = `<div class="status-dot status-${c.status}"></div><div><div class="fw-bold">${c.display_name}</div></div>`;
            div.onclick = () => selectContact(c); container.appendChild(div);
        });
    }

    async function selectContact(contact) {
        selectedContactId = contact.id; document.getElementById('activeChatName').innerText = contact.display_name;
        document.getElementById('welcomeArea').classList.add('hidden'); document.getElementById('chatArea').classList.remove('hidden');
        renderContactList(contacts);
        const resp = await fetch(`${API_URL}/messages/${contact.id}`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (resp.ok) {
            const messages = await resp.json(); const history = document.getElementById('messageHistory'); history.innerHTML = '';
            messages.forEach(m => appendMessage(m.sender_id === userId ? "sent" : "received", m.content));
        }
    }

    function appendMessage(type, content) {
        const history = document.getElementById('messageHistory'), div = document.createElement('div');
        div.className = `message ${type}`; div.innerText = content; history.appendChild(div); history.scrollTop = history.scrollHeight;
    }

    document.getElementById('loginBtn').onclick = login;
    document.getElementById('doRegisterBtn').onclick = register;
    document.getElementById('webCallBtn').onclick = startWebCall;
    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('messageInput');
        ws.send(JSON.stringify({ type: "CHAT_SEND", payload: { conversation_id: selectedContactId, sender_id: userId, content: input.value } }));
        appendMessage("sent", input.value); input.value = '';
    };
</script>
</body>
</html>
