<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skype Reborn</title>
  <link rel="stylesheet" href="/web/css/style.css">
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────── -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">💬</span>
      <h1>Skype Reborn</h1>
    </div>

    <div id="loginForm">
      <h2>Sign in</h2>
      <div class="field-group">
        <label for="username">Skype Name</label>
        <input id="username" type="text" autocomplete="username" placeholder="Your Skype name">
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      </div>
      <label class="checkbox-row">
        <input id="rememberMe" type="checkbox"> Remember me
      </label>
      <button id="loginBtn" class="btn-primary btn-full">Sign In</button>
      <button id="toRegisterBtn" class="btn-link btn-full">Create account</button>
    </div>

    <div id="registerForm" class="hidden">
      <h2>Create account</h2>
      <div class="field-group"><label>Skype Name</label><input id="reg_user" type="text" placeholder="Choose a username"></div>
      <div class="field-group"><label>Password</label><input id="reg_pass" type="password" placeholder="Choose a password"></div>
      <div class="field-group"><label>Email</label><input id="reg_email" type="email" placeholder="Email address"></div>
      <div class="field-row">
        <div class="field-group"><label>First Name</label><input id="reg_fname" type="text" placeholder="First"></div>
        <div class="field-group"><label>Last Name</label><input id="reg_lname" type="text" placeholder="Last"></div>
      </div>
      <button id="doRegisterBtn" class="btn-primary btn-full">Create Account</button>
      <button id="toLoginBtn" class="btn-link btn-full">Back to sign in</button>
    </div>

    <div id="authStatus" class="auth-status"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────── -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="my-profile">
        <div class="avatar" id="myAvatar">?</div>
        <div class="profile-info">
          <span id="myUsername" class="display-name">—</span>
          <span id="myStatus" class="status-text online">Online</span>
        </div>
        <button id="statusDropBtn" class="icon-btn" title="Change status" aria-label="Change status">▾</button>
        <button id="logoutBtn" class="icon-btn" title="Sign out" aria-label="Sign out">⎋</button>
      </div>
      <div id="statusMenu" class="status-menu hidden">
        <button data-status="ONLINE">🟢 Online</button>
        <button data-status="AWAY">🟡 Away</button>
        <button data-status="BUSY">🔴 Busy</button>
        <button data-status="INVISIBLE">⚫ Invisible</button>
      </div>
      <div class="search-bar">
        <input id="searchInput" type="search" placeholder="Search contacts…" aria-label="Search contacts">
      </div>
    </div>
    <div id="contactList" class="contact-list" role="list" aria-label="Contacts"></div>
  </aside>

  <!-- Chat area -->
  <main class="chat-area">
    <!-- Welcome placeholder -->
    <div id="welcomePane" class="welcome-pane">
      <span class="welcome-icon">💬</span>
      <p>Select a contact to start chatting</p>
    </div>

    <!-- Active conversation -->
    <div id="chatPane" class="chat-pane hidden">
      <header class="chat-header">
        <div class="chat-header-info">
          <div id="chatAvatar" class="avatar">?</div>
          <div>
            <div id="chatName" class="display-name"></div>
            <div id="typingIndicator" class="typing-indicator hidden">typing…</div>
          </div>
        </div>
        <div class="chat-header-actions">
          <button id="callBtn" class="btn-icon-round" title="Voice call" aria-label="Voice call">📞</button>
        </div>
      </header>

      <div id="messageHistory" class="message-history" role="log" aria-live="polite" aria-label="Messages"></div>

      <div id="replyBar" class="reply-bar hidden">
        <span id="replyLabel" class="reply-label"></span>
        <button id="cancelReplyBtn" class="btn-cancel-reply" aria-label="Cancel reply">✕</button>
      </div>

      <footer class="chat-footer">
        <textarea id="messageInput" class="message-input" rows="1"
          placeholder="Type a message…  Enter = send, Shift+Enter = newline"
          aria-label="Type a message"></textarea>
        <button id="sendBtn" class="btn-send" disabled aria-label="Send">Send</button>
      </footer>
    </div>
  </main>
</div>

<!-- ── Incoming call modal ────────────────────────────────────────── -->
<div id="incomingCallModal" class="call-modal hidden" role="dialog" aria-modal="true" aria-label="Incoming call">
  <div class="call-card incoming">
    <div class="call-avatar-lg" id="incomingAvatar">?</div>
    <div class="call-peer-name" id="incomingName">Someone</div>
    <div class="call-sub">Incoming voice call…</div>
    <div class="call-btn-row">
      <button id="answerBtn"  class="call-btn answer"  aria-label="Answer">Answer</button>
      <button id="declineBtn" class="call-btn decline" aria-label="Decline">Decline</button>
    </div>
  </div>
</div>

<!-- ── Active / outgoing call overlay ───────────────────────────── -->
<div id="activeCallOverlay" class="call-overlay hidden" role="dialog" aria-modal="true" aria-label="Active call">
  <div class="call-card active">
    <div class="call-avatar-lg" id="activeCallAvatar">?</div>
    <div class="call-peer-name" id="activeCallName">—</div>
    <div class="call-sub"      id="activeCallStatus">Calling…</div>
    <div class="call-timer"    id="callTimer"></div>
    <div class="call-btn-row">
      <button id="muteBtn"   class="call-btn mute"   aria-label="Toggle mute">🎤 Mute</button>
      <button id="hangupBtn" class="call-btn hangup"  aria-label="End call">End Call</button>
    </div>
  </div>
</div>

<!-- Remote audio (WebRTC) -->
<audio id="remoteAudio" autoplay aria-hidden="true"></audio>

<!-- Toast container -->
<div id="toastContainer" class="toast-container" aria-live="assertive"></div>

<script type="module" src="/web/js/app.js"></script>
</body>
</html>
